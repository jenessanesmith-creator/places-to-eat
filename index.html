const niceDate = (iso) => { const p = String(iso).split('-'); return p.length === 3 ? MONTHS[Number(p[1]) - 1] + ' ' + Number(p[2]) : ''; };
const daysSince = (iso) => { const t = Date.parse(iso + 'T12:00:00'); const n0 = Date.parse(todayIso + 'T12:00:00'); return isNaN(t) ? 999 : Math.round((n0 - t) / 86400000); };
const saveMarks = (next) => { try { localStorage.setItem('eatMarks', JSON.stringify(next)); } catch (e) {} this.setState({ marks: next }); };
const toggleTried = (id) => () => {
const been = Object.assign({}, tried); const want = Object.assign({}, wants);
if (been[id]) { delete been[id]; } else { been[id] = todayIso; delete want[id]; }
saveMarks({ been: been, want: want });
};
const toggleWant = (id) => () => {
const want = Object.assign({}, wants);
if (want[id]) { delete want[id]; } else { want[id] = true; }
saveMarks({ been: tried, want: want });
};

const vibeLabels = { date: 'Date night', family: 'Family / kid-friendly', group: 'Group dinner', brunch: 'Brunch', lunch: 'Lunch', birthday: 'Birthday dinner', casual: 'Casual catch-up', solo: 'Solo meal', patio: 'Good patio' };

const chip = (on) => on
? { bg: '#1F5B43', fg: '#FFFFFF', bd: '#1F5B43' }
: { bg: '#FFFFFF', fg: '#17231D', bd: '#8A968D' };
const multi = (key, cur, opts) => opts.map((o) => {
const on = !!cur[o[0]];
return Object.assign({ label: o[1], on: on, toggle: () => this.setState({ [key]: Object.assign({}, cur, { [o[0]]: !on }) }) }, chip(on));
});
const onKeys = (o) => Object.keys(o).filter((k) => o[k]);
const same = (list) => list.map((x) => [x, x]);

const groups = [
{ title: 'Distance from home', chips: [[3, '3 mi'], [5, '5 mi'], [10, '10 mi'], [15, '15 mi'], [20, '20 mi'], [99, 'Any']].map((d) => Object.assign({ label: d[1], on: dist === d[0], toggle: () => this.setState({ dist: d[0] }) }, chip(dist === d[0]))) },
{ title: 'Occasion', chips: multi('occasions', occasions, [['date', 'Date night'], ['family', 'Family / kid-friendly'], ['group', 'Group dinner'], ['brunch', 'Brunch'], ['lunch', 'Lunch'], ['birthday', 'Birthday dinner'], ['casual', 'Casual catch-up'], ['solo', 'Solo meal'], ['patio', 'Good patio']]) },
{ title: 'Right now', chips: multi('flags', flags, [['open', 'Open now'], ['happy', 'Happy hour today'], ['special', 'Special today']]) }
];
const moreAll = [
{ title: 'My places', chips: multi('mine', mine, [['new', 'Have not been'], ['want', 'Want to try'], ['been', 'Been there']]) },
{ title: 'Local legends', chips: multi('flags', flags, [['famous', 'Omaha famous']]) },
{ title: 'Drinks', chips: multi('drinks', drinks, [['bar', 'Bar'], ['speakeasy', 'Speakeasy'], ['Cocktail bar', 'Cocktail bar'], ['Wine bar', 'Wine bar'], ['Brewery', 'Brewery'], ['Coffee shop', 'Coffee shop']]) },
{ title: 'Cuisine', chips: multi('cuisines', cuisines, same(['American', 'Burgers', 'Pizza', 'Italian', 'Mexican', 'Latin American', 'Sushi', 'Ramen', 'Thai', 'Chinese', 'Vietnamese', 'Korean', 'Indian', 'Mediterranean', 'African', 'BBQ', 'Seafood', 'Steakhouse', 'Southern', 'French', 'Vegan', 'Dessert', 'Sports bar'])) },
{ title: 'Price', chips: multi('prices', prices, [['1', '$'], ['2', '$$'], ['3', '$$$']]) },
{ title: 'Rating', chips: [[0, 'Any'], [3.5, '3.5+ stars'], [4, '4+ stars'], [4.5, '4.5+ stars']].map((r) => Object.assign({ label: r[1], on: minRating === r[0], toggle: () => this.setState({ minRating: r[0] }) }, chip(minRating === r[0]))) }
];

const todaySpecial = (p) => {
const sp = p.specials.filter((x) => x.day === today)[0];
return sp ? sp.text : '';
};
const openState = (p) => {
if (!p.hours) return null;
const h = p.hours[today];
return !!h && hourNow >= h[0] && hourNow < h[1];
};
const happyToday = (p) => p.hhDays.indexOf(today) !== -1;
const cOn = onKeys(cuisines);
const pOn = onKeys(prices);
const oOn = onKeys(occasions);
const dOn = onKeys(drinks);
const mOn = onKeys(mine);
const markOf = (p) => tried[p.id] ? 'been' : wants[p.id] ? 'want' : 'new';
const matches = places.filter((p) => {
if (p.dist > dist) return false;
if (oOn.some((o) => p.vibes.indexOf(o) === -1)) return false;
if (cOn.length && !cuisines[p.cuisine]) return false;
if (dOn.length && !dOn.some((k) => k === p.cuisine || p.vibes.indexOf(k) !== -1)) return false;
if (mOn.length && !(mine[markOf(p)] || (mine.want && wants[p.id]))) return false;
if (pOn.length && !prices[String(p.price)]) return false;
if (minRating && !(p.rating >= minRating)) return false;
if (flags.famous && !p.famous) return false;
if (flags.open && openState(p) !== true) return false;
if (flags.happy && !happyToday(p)) return false;
if (flags.special && !todaySpecial(p)) return false;
return true;
});
const sorted = matches.slice().sort((a, b) => sort === 'rating' ? (b.rating || 0) - (a.rating || 0) || a.dist - b.dist : a.dist - b.dist);

const dollars = ['', '$', '$$', '$$$'];
const view = (p, from) => {
const tags = [];
const sp = todaySpecial(p);
if (p.famous) tags.push({ label: 'Omaha famous' });
if (sp) tags.push({ label: 'Today: ' + sp });
if (happyToday(p)) tags.push({ label: 'Happy hour today' });
if (p.vibes.indexOf('speakeasy') !== -1) tags.push({ label: 'Speakeasy' });
if (tried[p.id]) tags.push({ label: 'Been there' });
if (wants[p.id]) tags.push({ label: 'Want to try' });
const o = openState(p);
const isTried = !!tried[p.id];
return {
name: p.name,
ratingText: p.rating ? '★ ' + p.rating.toFixed(1) : 'No rating yet',
ratingNote: p.yelpN ? 'Yelp rating from ' + p.yelpN + ' reviews. Checked ' + CHECKED + '.' : (p.rating ? 'Rating from OpenTable.' : ''),
hasReviews: !!p.rev,
revSum: p.rev ? p.rev.sum : '',
tips: p.rev ? p.rev.tips.map((x) => ({ text: x })) : [],
revSource: p.rev ? 'Summarized by AI from Yelp reviews' + (p.rev.y ? ' (' + p.rev.y.toFixed(1) + ' stars, ' + p.rev.n + ' reviews)' : '') + '. Last checked ' + CHECKED + '.' : '',
meta: p.cuisine + ' · ' + dollars[p.price] + ' · ' + p.dist.toFixed(1) + ' mi · ' + p.area,
status: o === null ? 'Hours not loaded' : o ? 'Open now' : 'Closed now',
statusBg: o === null ? '#EEF2EB' : o ? '#DDF0E4' : '#F6E3D6',
statusFg: o === null ? '#2D3A33' : o ? '#174A36' : '#7A2E0B',
tags: tags,
vibesText: p.vibes.map((v) => vibeLabels[v]).filter((x) => x).join(' · '),
happyText: p.hhText || 'None found',
specials: p.specials.length ? p.specials : [{ day: '', text: 'None found' }],
featuresText: p.note || 'Nothing extra listed',
isFamous: !!p.famous,
mapUrl: 'https://maps.apple.com/?q=' + encodeURIComponent(p.name + ', ' + p.area.split(',')[0] + (/, IA$/.test(p.area) ? ', IA' : ', NE')),
famous: p.famous,
tried: isTried,
triedLabel: isTried ? 'Been there · ' + niceDate(tried[p.id]) : 'Been there',
triedOn: isTried ? 'Tried ' + niceDate(tried[p.id]) : '',
want: !!wants[p.id],
toggleWant: toggleWant(p.id),
beenBg: isTried ? '#1F5B43' : '#FFFFFF', beenFg: isTried ? '#FFFFFF' : '#17231D', beenBd: isTried ? '#1F5B43' : '#8A968D',
wantBg: wants[p.id] ? '#1F5B43' : '#FFFFFF', wantFg: wants[p.id] ? '#FFFFFF' : '#17231D', wantBd: wants[p.id] ? '#1F5B43' : '#8A968D',
hasHappy: p.hhDays.length > 0,
hasSpecials: p.specials.length > 0,
checked: CHECKED,
checkLabel: (isTried ? 'Mark as not tried: ' : 'Mark as tried: ') + p.name,
boxBg: isTried ? '#1F5B43' : '#FFFFFF',
boxBd: isTried ? '#1F5B43' : '#8A968D',
toggleTried: toggleTried(p.id),
open: () => this.setState({ screen: 'detail', selectedId: p.id, from: from })
};
};

const famousPlaces = places.filter((p) => p.famous);
const triedCount = famousPlaces.filter((p) => tried[p.id]).length;
const defaultId = screen === 'detail' && !s.selectedId ? 'stellas' : s.selectedId;
const selected = places.filter((p) => p.id === defaultId)[0] || places[0];
const notVetoed = matches.filter((p) => !vetoed[p.id]);
const fresh = notVetoed.filter((p) => !(tried[p.id] && daysSince(tried[p.id]) < 7));
const pool = fresh.length ? fresh : notVetoed;
const poolSorted = sorted.filter((p) => pool.indexOf(p) !== -1);
const picked = pool.filter((p) => p.id === s.pickId)[0] || poolSorted[0] || null;
const pickFrom = (excludeId) => { const c = pool.length > 1 && excludeId ? pool.filter((p) => p.id !== excludeId) : pool; return c.length ? c[Math.floor(Math.random() * c.length)].id : null; };
const untried = famousPlaces.filter((p) => !tried[p.id]).sort((a, b) => a.dist - b.dist);
const nextGoal = [5, 10, 15, 20, 25].filter((g) => g > triedCount)[0];
const moreCount = (minRating ? 1 : 0) + cOn.length + pOn.length + dOn.length + mOn.length + (flags.famous ? 1 : 0);
const n = matches.length;
const filterCount = (minRating ? 1 : 0) + oOn.length + cOn.length + pOn.length + dOn.length + mOn.length + onKeys(flags).length;

return {
isFilters: screen === 'filters',
isResults: screen === 'results',
isDetail: screen === 'detail',
isPick: screen === 'pick',
isFamous: screen === 'famous',
groups: groups,
moreGroups: showMore ? moreAll : [],
showMore: showMore,
moreLabel: (showMore ? 'Fewer filters' : 'More filters') + (moreCount ? ' (' + moreCount + ' on)' : ''),
toggleMore: () => this.setState({ showMore: !showMore }),
milestoneText: triedCount === famousPlaces.length ? 'All 25 done. You are officially Omaha famous.' : (nextGoal - triedCount) + ' more to reach ' + nextGoal,
hasNextUp: untried.length > 0,
nextUp: untried.length ? view(untried[0], 'famous') : { name: '', meta: '', open: () => {} },
noPickTitle: matches.length ? 'You vetoed everything' : 'Nothing to pick from yet',
noPickText: matches.length ? 'Every match is off the table for tonight. Start over or change your filters.' : 'No places match your filters. Loosen them and spin again.',
noPickLabel: matches.length ? 'Start over' : 'Change filters',
noPickAction: matches.length ? () => this.setState({ vetoed: {}, pickId: null }) : () => this.setState({ screen: 'filters' }),
notTonight: () => { if (!picked) return; const v = Object.assign({}, vetoed, { [picked.id]: true }); const left = pool.filter((p) => !v[p.id]); const rest = left.length ? left : notVetoed.filter((p) => !v[p.id]); this.setState({ vetoed: v, pickId: rest.length ? rest[Math.floor(Math.random() * rest.length)].id : null }); },
famousProgress: triedCount + ' of ' + famousPlaces.length + ' tried',
famousPct: Math.round(100 * triedCount / famousPlaces.length) + '%',
famousList: famousPlaces.map((p) => view(p, 'famous')),
countLabel: n === 0 ? 'No places match' : n === 1 ? 'Show 1 place' : 'Show ' + n + ' places',
resultsTitle: n === 1 ? '1 place to eat' : n + ' places to eat',
filterSummary: (dist === 99 ? 'Any distance' : 'Within ' + dist + ' mi') + ' · ' + (filterCount === 0 ? 'no filters' : filterCount === 1 ? '1 filter' : filterCount + ' filters'),
sorts: [
Object.assign({ label: 'Nearest', on: sort === 'dist', toggle: () => this.setState({ sort: 'dist' }) }, chip(sort === 'dist')),
Object.assign({ label: 'Top rated', on: sort === 'rating', toggle: () => this.setState({ sort: 'rating' }) }, chip(sort === 'rating'))
],
results: sorted.map((p) => view(p, 'results')),
hasResults: n > 0,
noResults: n === 0,
d: view(selected, s.from || 'results'),
k: picked ? view(picked, 'pick') : { name: '', vibesText: '', meta: '', status: '', statusBg: '#FFFFFF', statusFg: '#17231D', tags: [], open: () => {} },
hasPick: !!picked,
noPick: !picked,
clearFilters: () => this.setState({ dist: 5, minRating: 0, occasions: {}, cuisines: {}, prices: {}, flags: {}, drinks: {}, mine: {}, vetoed: {} }),
showResults: () => this.setState({ screen: 'results' }),
goFilters: () => this.setState({ screen: 'filters' }),
goResults: () => this.setState({ screen: 'results' }),
goFamous: () => this.setState({ screen: 'famous' }),
goBack: () => this.setState({ screen: s.from || 'results' }),
pickForMe: () => {
const current = picked && screen === 'pick' ? picked.id : null;
this.setState({ screen: 'pick', pickId: pickFrom(current) });
}
};
}
}

: '<div class="center"><h1 class="disp" style="font-size:30px;line-height:1.1">' + e(v.noPickTitle) + '</h1><p class="pale" style="font-size:16px">' + e(v.noPickText) + '</p><button type="button" class="primary gold" style="flex:none" data-h="' + H(v.noPickAction) + '">' + e(v.noPickLabel) + '</button></div>'); }
return '<div class="headrow"><button type="button" class="back" aria-label="Back to filters" data-h="' + H(v.goFilters) + '">' + BACK + '</button><div style="flex:1 1 0;display:flex;flex-direction:column;gap:8px;padding-top:6px"><h1 class="disp" style="font-size:26px;line-height:1.15">Omaha Famous</h1><p class="muted" style="font-size:14px">' + e(v.famousProgress) + '</p><div class="bar"><div style="width:' + v.famousPct + '"></div></div><p style="font-size:14px;font-weight:600;color:#1F5B43">' + e(v.milestoneText) + '</p></div></div>'
+ '<div class="scroll" style="gap:10px">' + (v.hasNextUp ? '<button type="button" class="greencard" style="gap:2px" data-h="' + H(v.nextUp.open) + '"><span class="pale" style="font-size:13px;font-weight:600">Next up, the closest one you have not tried</span><span class="disp" style="font-size:19px;font-weight:600">' + e(v.nextUp.name) + '</span><span class="pale" style="font-size:14px">' + e(v.nextUp.meta) + '</span></button>' : '')
+ v.famousList.map((f) => '<div class="fam"><button type="button" class="check" aria-pressed="' + f.tried + '" aria-label="' + e(f.checkLabel) + '" data-h="' + H(f.toggleTried) + '"><span class="box" style="border-color:' + f.boxBd + ';background:' + f.boxBg + '">' + TICK + '</span></button><button type="button" class="famtxt" data-h="' + H(f.open) + '"><span class="disp" style="display:block;font-size:18px;font-weight:600">' + e(f.name) + '</span><span style="display:block;margin-top:2px;font-size:14px;color:#2D3A33">' + e(f.famous) + '</span><span class="muted" style="display:block;margin-top:4px;font-size:13px">' + e(f.meta) + '</span><span style="display:block;margin-top:4px;font-size:13px;font-weight:600;color:#1F5B43">' + e(f.triedOn) + '</span></button></div>').join('') + '</div>';
}
function draw() {
const v = app.renderVals();
const scr = v.isFilters ? 'filters' : v.isResults ? 'results' : v.isDetail ? 'detail' : v.isPick ? 'pick' : 'famous';
const sc = root.querySelector('.scroll');
const keep = sc && scr === lastScreen ? sc.scrollTop : 0;
handlers = [];
root.className = v.isPick ? 'green' : '';
root.innerHTML = view(v);
const sc2 = root.querySelector('.scroll');
if (sc2) sc2.scrollTop = keep;
lastScreen = scr;
}
root.addEventListener('click', (ev) => { const t = ev.target.closest('[data-h]'); if (t && handlers[Number(t.dataset.h)]) handlers[Number(t.dataset.h)](); });
draw();
</script>
</body>
</html>
